databaseChangeLog:
  - changeSet:
      id: 005-create-point-arret
      author: gabi
      changes:
        - createTable:
            tableName: point_arret
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: trajet_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_point_arret_trajet
                    references: trajet(id)
              - column:
                  name: ville
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: ordre
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: heure_passage
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: prix_depuis_depart
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false