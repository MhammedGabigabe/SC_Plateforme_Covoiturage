databaseChangeLog:
  - changeSet:
      id: 003-create-vehicule
      author: gabi
      changes:
        - createTable:
            tableName: vehicule
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: marque
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: modele
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: immatriculation
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: couleur
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: capacite
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: conducteur_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_vehicule_conducteur
                    references: conducteur(id)