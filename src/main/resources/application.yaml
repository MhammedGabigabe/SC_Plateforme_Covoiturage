spring:
  application:
    name: covoiturage

  datasource:
    url: jdbc:postgresql://localhost:5433/covoiturage
    username: covoiturage
    password: covoiturage

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: dev

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

logging:
  level:
    ma.youcode.covoiturage: INFO