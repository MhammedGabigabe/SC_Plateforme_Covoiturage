services:
  postgres:
    image: postgres:16-alpine
    container_name: covoiturage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: covoiturage
      POSTGRES_USER: covoiturage
      POSTGRES_PASSWORD: covoiturage
    ports:
      - "5433:5432"
    volumes:
      - covoiturage-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covoiturage -d covoiturage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  covoiturage-data: